<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 道旅图片 CDN 有防盗链：带 127.0.0.1 的 Referer 会 403 AccessDenied，
     全页不发 Referer，图片和点击打开的新标签页才能正常加载 -->
<meta name="referrer" content="no-referrer">
<title>酒店预订 Agent · Web 版</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 780px; margin: 0 auto; padding: 16px; }
  h1 { color: #2c3e50; }
  .topbar { display: flex; gap: 12px; margin-bottom: 12px; font-size: 13px; color: #666; }
  .topbar a { color: #2980b9; text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }
  .tag { background: #ecf0f1; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.mem { background: #ffeaa7; color: #b8860b; }
  .tag.sql { background: #dff0d8; color: #2d6a4f; }
  .tag.mys { background: #fce4ec; color: #c2185b; }
  #chatbox { height: 500px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; background: #fafafa; margin-bottom: 12px; white-space: pre-wrap; font-size: 14px; }
  #chatbox .user { text-align: right; margin: 6px 0; }
  #chatbox .user span { background: #3498db; color: #fff; padding: 6px 10px; border-radius: 8px; display: inline-block; max-width: 80%; }
  #chatbox .bot { margin: 6px 0; }
  #chatbox .bot span { background: #fff; border: 1px solid #e0e0e0; padding: 6px 10px; border-radius: 8px; display: inline-block; max-width: 85%; }
  #chatbox .sys { text-align: center; color: #aaa; font-size: 12px; margin: 8px 0; }
  #chatbox .bot.status span { background: #f8f9fa; color: #7f8c8d; font-style: italic; border-style: dashed; }
  #chatbox .bot a { color: #2980b9; word-break: break-all; }
  #chatbox .bot .chat-img { display: block; max-width: 280px; max-height: 190px; border-radius: 8px; margin: 6px 0; cursor: zoom-in; border: 1px solid #e0e0e0; min-height: 56px; background: #f5f6f7; }
  /* 房型多图：横向图组，可左右滑动，避免整条消息被几十张图拉成长条 */
  #chatbox .bot .chat-gallery { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0 4px; white-space: normal; }
  #chatbox .bot .chat-gallery .chat-img { flex: 0 0 auto; width: 170px; height: 115px; margin: 0; object-fit: cover; }
  #chatbox .bot .chat-gallery > a { flex: 0 0 auto; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #chatbox .bot .chat-gallery::-webkit-scrollbar { height: 6px; }
  #chatbox .bot .chat-gallery::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  /* “展开全部”：逐段补真实评分后追加展示 */
  #chatbox .bot .expand-hotels { display: block; margin: 8px 0 0; padding: 4px 12px; font-size: 12px; color: #2980b9; background: #fff; border: 1px dashed #2980b9; border-radius: 12px; cursor: pointer; }
  #chatbox .bot .expand-hotels:disabled { color: #95a5a6; border-color: #ccc; cursor: default; }
  #inputrow { display: flex; gap: 8px; }
  #inputrow textarea { flex: 1; height: 64px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: none; }
  #inputrow button { padding: 0 20px; background: #2980b9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #inputrow button:disabled { background: #95a5a6; cursor: not-allowed; }
  .example { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<h1>🏨 酒店预订 Agent</h1>
<div class="topbar">
  <span class="tag {{ 'mem' if storage_backend == 'memory' else ('sql' if storage_backend == 'sqlite' else 'mys') }}">
    存储：{{ storage_backend }}（{{ '真实持久化' if storage_enabled else '内存回退' }}）
  </span>
  <a href="/orders">📋 查看历史订单</a>
</div>

<div id="chatbox">
  <div class="sys">👋 你好！告诉我想订哪的酒店就行，例如"帮我订下周末三亚海景房，预算 1000 以内"。</div>
</div>

<div id="inputrow">
  <textarea id="input" placeholder="输入你的需求…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>
<div class="example">
  提示：多轮对话已支持（同一浏览器会话保持搜索/选房状态）；重启 Web 进程会话重置。图片与链接可直接点击，等待期间可看到实时进度（理解需求 → 搜索酒店 → 获取报价）。
</div>

<script>
const chatbox = document.getElementById("chatbox");
const input   = document.getElementById("input");
const send    = document.getElementById("send");

// ---------- 会话标识：localStorage 持久化，同一浏览器刷新/重开不丢会话 ----------
let sessionId = localStorage.getItem("hb_session_id");
if (!sessionId) {
  sessionId = (crypto.randomUUID ? crypto.randomUUID()
                                  : "s-" + Date.now() + "-" + Math.random().toString(36).slice(2));
  localStorage.setItem("hb_session_id", sessionId);
}

// ---------- 富文本渲染：URL → 内嵌图片 / 可点链接（DOM API 拼装，无 XSS 风险）----------
const URL_RE   = /https?:\/\/[^\s，。；、！？（）)】"'<>]+/g;
const IMG_RE   = /\.(jpe?g|png|webp|gif)[^\s]*$/i;   // 扩展名后允许 CDN 尾巴（如 .jpg-t、?x-oss-…）

// ---------- 图片串行加载队列 ----------
// 道旅 CDN 有突发并发风控：实测 8 张同时请求 → 5 张 403。
// 改为逐张加载（失败重试 1 次），彻底避开限流窗口。
const _imgQueue = [];
let _imgBusy = false;
// 房型图组一次可能出现几十张：滚动到可视区附近才入队，
// 既避免串行加载太久，也不并发冲击 CDN 风控。
let _imgObserver = null;

function _enqueueImg(img, url) {
  img.dataset.src = url;
  if (!("IntersectionObserver" in window)) { _pushImg(img, url); return; }
  if (!_imgObserver) {
    _imgObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        _imgObserver.unobserve(e.target);
        _pushImg(e.target, e.target.dataset.src);
      }
    }, { root: chatbox, rootMargin: "300px 0px" });
  }
  _imgObserver.observe(img);
}

function _pushImg(img, url) {
  _imgQueue.push([img, url]);
  _pumpImg();
}

function _pumpImg() {
  if (_imgBusy || !_imgQueue.length) return;
  _imgBusy = true;
  const [img, url] = _imgQueue.shift();
  const finish = () => { _imgBusy = false; _pumpImg(); };
  img.onload = finish;
  img.onerror = () => {
    if (+(img.dataset.retry || 0) < 1) {          // 403 是临时风控，稍候重试一次
      img.dataset.retry = "1";
      setTimeout(() => { img.src = url; }, 800);
      return;                                     // 不 finish，重试结果出来再放行
    }
    const a = document.createElement("a");        // 仍失败：退化为可点链接
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url;
    img.replaceWith(a);
    finish();
  };
  img.src = url;
}

function renderRich(span, text, appendMode) {
  // 按 URL 分段：普通文本走 textNode，图片 URL 渲染 <img>，其余渲染 <a>
  // appendMode=true 时保留已有内容，用于“展开全部”把后续酒店追加到同一条消息
  if (!appendMode) span.textContent = "";
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while ((m = URL_RE.exec(text)) !== null) {
    if (m.index > last) {
      span.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const url = m[0];
    if (IMG_RE.test(url)) {
      const img = document.createElement("img");
      img.className = "chat-img";
      img.alt = "酒店实拍图";
      img.referrerPolicy = "no-referrer";
      img.onclick = () => window.open(url, "_blank", "noopener,noreferrer");
      _enqueueImg(img, url);          // 串行队列加载，失败重试后仍败则退化 <a>
      span.appendChild(img);
    } else {
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "🔗 " + url;
      span.appendChild(a);
    }
    last = m.index + url.length;
  }
  if (last < text.length) {
    span.appendChild(document.createTextNode(text.slice(last)));
  }
  groupGalleries(span);
}

// 把连续出现的图片包进一个横向图组（房型多图），单张图保持原样
function groupGalleries(span) {
  const nodes = Array.from(span.childNodes);
  for (let i = 0; i < nodes.length; i++) {
    const first = nodes[i];
    if (first.nodeType !== 1 || !first.classList.contains("chat-img")) continue;
    const run = [first];
    let j = i + 1;
    while (j < nodes.length) {
      const n = nodes[j];
      if (n.nodeType === 3 && !n.textContent.trim()) { j++; continue; }
      if (n.nodeType === 1 && n.classList.contains("chat-img")) { run.push(n); j++; continue; }
      break;
    }
    if (run.length > 1) {
      // 清掉图与图之间的换行/缩进，否则图组前后会多出空行
      for (let k = i + 1; k < j; k++) {
        const n = nodes[k];
        if (n.nodeType === 3 && !n.textContent.trim()) n.remove();
      }
      const box = document.createElement("span");
      box.className = "chat-gallery";
      first.before(box);
      run.forEach(img => box.appendChild(img));
    }
    i = j - 1;
  }
}

function append(cls, text, rich) {
  const div = document.createElement("div");
  div.className = cls;
  const span = document.createElement("span");
  if (rich) { renderRich(span, text); }
  else      { span.textContent = text; }
  div.appendChild(span);
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
  return div;
}

// ---------- 展开全部：按需补全剩余酒店的真实评分 ----------
// 后端每段补 5 家（受百度/高德 QPS 限制，约 2-3 秒），逐段追加而不是一次等完。
// 评分全部来自真实接口/7 天缓存；查不到仍是“暂无评分”，不做任何伪造。
async function expandHotels(div, span, btn) {
  btn.disabled = true;
  const total = +btn.dataset.total;
  let offset = +btn.dataset.next;
  try {
    while (offset < total) {
      if (btn.dataset.stale) return;    // 用户已发新消息，搜索结果被替换，停止追加
      btn.textContent = `⏳ 正在补全评分…（已展示 ${offset}/${total} 家）`;
      const r = await fetch("/api/hotels/more", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, offset, limit: 5}),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (d.text) renderRich(span, "\n" + d.text, true);
      if (!d.next || d.next <= offset) break;     // 防御：后端未推进则退出
      offset = d.next;
      btn.dataset.next = offset;
      chatbox.scrollTop = chatbox.scrollHeight;
    }
    btn.remove();
  } catch (e) {
    // 保留已展开部分，允许从断点重试
    btn.disabled = false;
    btn.textContent = "展开失败，点击重试";
  }
}

function addHotelExpander(div, span, total, shown) {
  const btn = document.createElement("button");
  btn.className = "expand-hotels";
  btn.textContent = `展开全部（共 ${total} 家）`;
  btn.dataset.next = shown;
  btn.dataset.total = total;
  btn.onclick = () => expandHotels(div, span, btn);
  div.appendChild(btn);
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  append("user", text);
  // 新一轮搜索会替换会话里的 search_results，旧消息的“展开全部”已失效
  chatbox.querySelectorAll(".expand-hotels").forEach(b => {
    b.dataset.stale = "1";
    b.remove();
  });
  input.value = "";
  send.disabled = true;
  // 状态条：SSE stage 事件实时更新文案（理解需求 → 搜索酒店 → 获取报价）
  const status = append("bot", "正在连接助手…");
  status.classList.add("status");
  try {
    const r = await fetch("/api/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_input: text, session_id: sessionId}),
    });
    if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", reply = null, currentOrder = "", errMsg = null;
    let hotelTotal = 0, hotelShown = 0;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {   // SSE 帧以空行分隔
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const d = JSON.parse(data);
        if (ev === "stage") {
          status.querySelector("span").textContent = "⏳ " + d.text;
        } else if (ev === "result") {
          reply = d.reply;
          currentOrder = d.current_order;
          hotelTotal = d.hotel_total || 0;
          hotelShown = d.hotel_shown || 0;
          if (d.session_id && d.session_id !== sessionId) {
            sessionId = d.session_id;
            localStorage.setItem("hb_session_id", sessionId);
          }
        } else if (ev === "error") {
          errMsg = d.message;
        }
      }
    }
    status.remove();
    if (errMsg) append("bot", "❌ " + errMsg);
    else if (reply !== null) {
      const botDiv = append("bot", reply, true);
      if (hotelTotal > hotelShown) {
        addHotelExpander(botDiv, botDiv.querySelector("span"), hotelTotal, hotelShown);
      }
      if (currentOrder) append("sys", "📌 " + currentOrder);
    } else append("bot", "(连接中断，未收到完整回复)");
  } catch (e) {
    status.remove();
    append("bot", "❌ 请求失败：" + e.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

send.onclick = sendMsg;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
</script>
</body>
</html>
