<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 道旅图片 CDN 有防盗链：带 127.0.0.1 的 Referer 会 403 AccessDenied，
     全页不发 Referer，图片和点击打开的新标签页才能正常加载 -->
<meta name="referrer" content="no-referrer">
<title>酒店预订 Agent · Web 版</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 780px; margin: 0 auto; padding: 16px; }
  h1 { color: #2c3e50; }
  .topbar { display: flex; gap: 12px; margin-bottom: 12px; font-size: 13px; color: #666; flex-wrap: wrap; align-items: center; }
  .topbar .spacer { flex: 1 1 auto; }
  .topbar a { color: #2980b9; text-decoration: none; }
  .topbar a:hover { text-decoration: underline; }
  .topbar select { max-width: 230px; padding: 3px 6px; border: 1px solid #ccc; border-radius: 6px; font-size: 12px; color: #333; background: #fff; }
  .topbar .mini { padding: 3px 10px; border: 1px solid #2980b9; background: #fff; color: #2980b9; border-radius: 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .topbar .mini:hover { background: #eaf4fb; }
  .topbar .mini:disabled, .topbar select:disabled { opacity: .55; cursor: not-allowed; }
  .tag { background: #ecf0f1; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .tag.mem { background: #ffeaa7; color: #b8860b; }
  .tag.sql { background: #dff0d8; color: #2d6a4f; }
  .tag.mys { background: #fce4ec; color: #c2185b; }
  #chatbox { height: 500px; overflow-y: auto; border: 1px solid #ddd; border-radius: 8px; padding: 12px; background: #fafafa; margin-bottom: 12px; white-space: pre-wrap; font-size: 14px; }
  #chatbox .user { text-align: right; margin: 6px 0; }
  #chatbox .user span { background: #3498db; color: #fff; padding: 6px 10px; border-radius: 8px; display: inline-block; max-width: 80%; }
  #chatbox .bot { margin: 6px 0; }
  #chatbox .bot span { background: #fff; border: 1px solid #e0e0e0; padding: 6px 10px; border-radius: 8px; display: inline-block; max-width: 85%; }
  #chatbox .sys { text-align: center; color: #aaa; font-size: 12px; margin: 8px 0; }
  #chatbox .sys.notice { color: #9a6a00; background: #fffbea; border: 1px dashed #e6c35c; border-radius: 6px; padding: 4px 8px; }
  #chatbox .bot.status span { background: #f8f9fa; color: #7f8c8d; font-style: italic; border-style: dashed; }
  #chatbox .bot a { color: #2980b9; word-break: break-all; }
  #chatbox .bot .chat-img { display: block; max-width: 280px; max-height: 190px; border-radius: 8px; margin: 6px 0; cursor: zoom-in; border: 1px solid #e0e0e0; min-height: 56px; background: #f5f6f7; }
  /* 房型多图：横向图组，可左右滑动，避免整条消息被几十张图拉成长条 */
  #chatbox .bot .chat-gallery { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0 4px; white-space: normal; }
  #chatbox .bot .chat-gallery .chat-img { flex: 0 0 auto; width: 170px; height: 115px; margin: 0; object-fit: cover; }
  #chatbox .bot .chat-gallery > a { flex: 0 0 auto; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  #chatbox .bot .chat-gallery::-webkit-scrollbar { height: 6px; }
  #chatbox .bot .chat-gallery::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  /* “展开全部”：逐段补真实评分后追加展示 */
  #chatbox .bot .expand-hotels { display: block; margin: 8px 0 0; padding: 4px 12px; font-size: 12px; color: #2980b9; background: #fff; border: 1px dashed #2980b9; border-radius: 12px; cursor: pointer; }
  #chatbox .bot .expand-hotels:disabled { color: #95a5a6; border-color: #ccc; cursor: default; }
  /* 结构化酒店卡片：数据来自后端 JSON（hotel_view.items），不解析回复文本 */
  #chatbox .bot .hotel-view { white-space: normal; max-width: 85%; margin-top: 6px; }
  #chatbox .bot .hotel-card { display: flex; gap: 10px; border: 1px solid #e3e7ea; border-radius: 10px; padding: 8px; margin: 8px 0; background: #fff; }
  #chatbox .bot .hotel-card .hc-thumb { width: 92px; height: 92px; flex: 0 0 auto; border-radius: 8px; object-fit: cover; background: #eef1f3; cursor: zoom-in; border: 1px solid #e0e0e0; }
  #chatbox .bot .hotel-card .hc-main { flex: 1 1 auto; min-width: 0; }
  #chatbox .bot .hotel-card .hc-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  #chatbox .bot .hotel-card .hc-meta { color: #555; font-size: 12px; line-height: 1.65; word-break: break-all; white-space: pre-line; }
  #chatbox .bot .hotel-card .hc-price { color: #c0392b; font-weight: 600; }
  #chatbox .bot .hotel-card .hc-actions { margin-top: 6px; display: flex; gap: 8px; align-items: center; }
  #chatbox .bot .hotel-card .hc-actions button { padding: 3px 14px; font-size: 12px; color: #fff; background: #2980b9; border: none; border-radius: 12px; cursor: pointer; }
  #chatbox .bot .hotel-card .hc-actions button:disabled { background: #bdc3c7; cursor: default; }
  #chatbox .bot .hotel-card .hc-rev { color: #aaa; font-size: 11px; }
  #chatbox .bot .hotel-card.stale { opacity: .55; }
  #chatbox .bot .hotel-card.stale .hc-actions button { background: #bdc3c7; }
  #chatbox .bot .hv-outro { white-space: pre-wrap; color: #555; font-size: 13px; margin-top: 8px; }
  #inputrow { display: flex; gap: 8px; }
  #inputrow textarea { flex: 1; height: 64px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; resize: none; }
  #inputrow button { padding: 0 20px; background: #2980b9; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  #inputrow button:disabled { background: #95a5a6; cursor: not-allowed; }
  .example { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<h1>🏨 酒店预订 Agent</h1>
<div class="topbar">
  <span class="tag {{ 'mem' if storage_backend == 'memory' else ('sql' if storage_backend == 'sqlite' else 'mys') }}">
    存储：{{ storage_backend }}（{{ '真实持久化' if storage_enabled else '内存回退' }}）
  </span>
  <a href="/orders">📋 查看历史订单</a>
  <span class="spacer"></span>
  <label for="session-select">会话</label>
  <select id="session-select" title="切换历史会话"></select>
  <button id="new-session" class="mini" type="button" title="开始一段新的对话">＋ 新建会话</button>
</div>

<div id="chatbox">
  <div class="sys">👋 你好！告诉我想订哪的酒店就行，例如"帮我订下周末三亚海景房，预算 1000 以内"。</div>
</div>

<div id="inputrow">
  <textarea id="input" placeholder="输入你的需求…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>
<div class="example">
  提示：聊天记录按会话保存在本浏览器，点击「查看历史订单」再返回不会丢失；顶栏可切换历史会话或新建会话。服务端上下文 30 分钟无活动会过期（历史记录仍保留）。图片与链接可直接点击，等待期间可看到实时进度（理解需求 → 搜索酒店 → 获取报价）。
</div>

<script>
const chatbox = document.getElementById("chatbox");
const input   = document.getElementById("input");
const send    = document.getElementById("send");
const sessionSelect = document.getElementById("session-select");
const newSessionBtn = document.getElementById("new-session");

// ---------- 多会话 + 聊天记录本地持久化 ----------
// 从 /orders 返回会重新加载页面：聊天记录存 localStorage，启动时按 sessionId 恢复。
// 存储结构：{active, sessions:[{id, createdAt, updatedAt, scroll, messages:[...]}]}
// 服务端 Agent 池仍由 sessionId 复用（见 web.py），这里只负责“看得见的历史”。
// 复用原有 append/renderRich/expandHotels，尽量不碰聊天主流程。
const STORE_KEY = "hb_sessions_v1";
const SID_KEY   = "hb_session_id";
const MAX_SESSIONS = 20;    // 本浏览器最多保留 20 段会话
const MAX_MESSAGES = 200;   // 单段会话最多保留 200 条消息

function _uid() {
  return crypto.randomUUID ? crypto.randomUUID()
    : "s-" + Date.now() + "-" + Math.random().toString(36).slice(2);
}
function _safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function _safeSet(key, val) {
  try { localStorage.setItem(key, val); return true; } catch (e) { return false; }
}

function loadStore() {
  try {
    const raw = _safeGet(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.sessions)) {
        data.sessions = data.sessions.filter(s => s && typeof s.id === "string" && s.id);
        for (const s of data.sessions) {
          if (!Array.isArray(s.messages)) s.messages = [];
          s.messages = s.messages.filter(m => m && typeof m.text === "string");
        }
        if (!data.active || !data.sessions.some(s => s.id === data.active)) {
          // 兼容旧版只存了 hb_session_id 的浏览器
          const legacy = _safeGet(SID_KEY) || "";
          data.active = data.sessions.some(s => s.id === legacy)
            ? legacy : (data.sessions[0] ? data.sessions[0].id : "");
        }
        return data;
      }
    }
  } catch (e) {
    console.warn("会话历史解析失败，已重建：", e);
  }
  return {active: "", sessions: []};
}

let store = loadStore();
let sessionId = "";
let _sessionCheck = 0;      // 会话存活检查序号：发送新消息后旧检查结果作废

function currentSession() {
  return store.sessions.find(s => s.id === store.active) || null;
}

function persist() {
  if (!_safeSet(STORE_KEY, JSON.stringify(store))) {
    // 浏览器配额满：先丢最旧的非当前会话，再压缩当前会话，尽量保住正在用的对话
    while (store.sessions.length > 1) {
      let victim = -1;
      for (let i = store.sessions.length - 1; i >= 0; i--) {
        if (store.sessions[i].id !== store.active) { victim = i; break; }
      }
      if (victim < 0) break;
      store.sessions.splice(victim, 1);
      if (_safeSet(STORE_KEY, JSON.stringify(store))) return;
    }
    const cur = currentSession();
    if (cur && cur.messages.length > 50) {
      cur.messages = cur.messages.slice(-50);
      if (_safeSet(STORE_KEY, JSON.stringify(store))) return;
    }
    console.warn("聊天记录保存失败：浏览器本地存储空间不足");
  }
}

function ensureSession() {
  let s = currentSession();
  if (s) { sessionId = s.id; return s; }
  s = {
    id: _safeGet(SID_KEY) || _uid(),
    createdAt: Date.now(), updatedAt: Date.now(), scroll: 0, messages: [],
  };
  store.sessions.unshift(s);
  store.active = s.id;
  sessionId = s.id;
  _safeSet(SID_KEY, s.id);
  persist();
  return s;
}

function trimSessions() {
  while (store.sessions.length > MAX_SESSIONS) {
    let victim = -1;
    for (let i = store.sessions.length - 1; i >= 0; i--) {
      if (store.sessions[i].id !== store.active) { victim = i; break; }
    }
    if (victim < 0) break;
    store.sessions.splice(victim, 1);
  }
}

function sessionLabel(s) {
  const first = (s.messages || []).find(m => m.role === "user");
  if (!first) return "新会话";
  const text = first.text.replace(/\s+/g, " ").trim();
  return text.length > 14 ? text.slice(0, 14) + "…" : text;
}

function updateSessionSelect() {
  const list = [...store.sessions].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  sessionSelect.innerHTML = "";
  for (const s of list) {
    const opt = document.createElement("option");
    opt.value = s.id;
    const d = new Date(s.updatedAt || s.createdAt || Date.now());
    const stamp = `${d.getMonth() + 1}/${d.getDate()} `
      + `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    opt.textContent = `${sessionLabel(s)} · ${stamp}`;
    sessionSelect.appendChild(opt);
  }
  sessionSelect.value = store.active;
}

function remember(role, text, extra) {
  const s = ensureSession();
  const rec = Object.assign({role, text, ts: Date.now()}, extra || {});
  s.messages.push(rec);
  if (s.messages.length > MAX_MESSAGES) {
    s.messages.splice(0, s.messages.length - MAX_MESSAGES);
  }
  s.updatedAt = Date.now();
  persist();
  updateSessionSelect();
  return rec;
}

function saveCurrentScroll() {
  const s = currentSession();
  if (!s) return;
  s.scroll = chatbox.scrollTop;
  persist();
}

// ---------- 结构化酒店卡片 ----------
// 列表数据来自后端 hotel_view（服务端 search_results 的快照），
// 选店只提交 {hotel_id, revision}：不经过模型，也不按序号猜。
// 卡片按钮在后端校验失败（409/404）时统一置灰，避免拿旧列表选出别家。
function sysNotice(text) {
  const rec = remember("sys", text);
  append("sys", rec.text, false, rec);
  chatbox.scrollTop = chatbox.scrollHeight;
  return rec;
}

function _hcMetaLines(item) {
  const star = item.star ? `${item.star}星` : "星级未知";
  const price = item.price_per_night
    ? `¥${item.price_per_night}/晚` : "价格以实际预订为准";
  let rating = "暂无评分";
  if (item.rating) {
    rating = `评分 ${item.rating}`;
    if (item.review_count) rating += `（${item.review_count}条）`;
    if (item.rating_source) rating += ` · ${item.rating_source}`;
  }
  const dist = (item.distance_m && item.distance_to)
    ? ` · 距${item.distance_to}约${Math.round(item.distance_m / 10) * 10}米` : "";
  const lines = [`${star} · ${price}`, `${rating}${dist}`,
                 `地址：${item.address || "待补充"}`];
  if (item.facilities && item.facilities.length) {
    lines.push(`设施：${item.facilities.join("、")}`);
  }
  if (item.room_types && item.room_types.length) {
    lines.push(`房型：${item.room_types.join("、")}`);
  }
  return lines.join("\n");
}

function appendHotelCard(box, item, pos, hv) {
  const card = document.createElement("div");
  card.className = "hotel-card";
  card.dataset.hotelId = item.hotel_id || "";

  if (item.image_url) {
    const img = document.createElement("img");
    img.className = "hc-thumb";
    img.alt = item.name || "酒店实拍图";
    img.referrerPolicy = "no-referrer";
    img.onclick = () => window.open(item.image_url, "_blank", "noopener,noreferrer");
    card.appendChild(img);
    _enqueueImg(img, item.image_url);   // 串行队列加载，失败退化链接
  }

  const main = document.createElement("div");
  main.className = "hc-main";

  const name = document.createElement("div");
  name.className = "hc-name";
  name.textContent = `${pos}. ${item.name || "酒店"}`;
  main.appendChild(name);

  const meta = document.createElement("div");
  meta.className = "hc-meta";
  meta.textContent = _hcMetaLines(item);
  main.appendChild(meta);

  const actions = document.createElement("div");
  actions.className = "hc-actions";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.textContent = "选这家";
  btn.onclick = () => selectHotel(item, hv, card, btn);
  actions.appendChild(btn);
  main.appendChild(actions);

  card.appendChild(main);
  box.appendChild(card);
  return card;
}

function renderHotelViewInto(div, hv, rec) {
  const span = div.querySelector("span");
  span.textContent = "";
  if (hv.intro) renderRich(span, hv.intro);
  const box = document.createElement("div");
  box.className = "hotel-view";
  div.appendChild(box);
  div.dataset.revision = hv.revision || "";
  const items = hv.items || [];
  items.forEach((it, i) => appendHotelCard(box, it, i + 1, hv));
  if (hv.outro) {
    const outro = document.createElement("div");
    outro.className = "hv-outro";
    outro.textContent = hv.outro.replace(/^\s+/, "");
    box.appendChild(outro);
  }
  if (rec) { rec.hotelView = hv; rec.next = items.length; }
  return box;
}

function markStaleCards(keepRevision) {
  chatbox.querySelectorAll(".hotel-view").forEach(view => {
    const div = view.closest(".bot");
    const rev = div ? (div.dataset.revision || "") : "";
    if (keepRevision && rev === keepRevision) return;
    view.querySelectorAll(".hotel-card").forEach(c => c.classList.add("stale"));
    view.querySelectorAll(".hotel-card button").forEach(b => {
      b.disabled = true;
      b.textContent = "列表已更新";
    });
  });
}

let _selecting = false;
async function selectHotel(item, hv, card, btn) {
  if (_selecting || !item || !item.hotel_id) return;
  _selecting = true;
  btn.disabled = true;
  btn.textContent = "选择中…";
  // 请求期间禁止切会话：回复必须落到当前这段对话里
  sessionSelect.disabled = true;
  newSessionBtn.disabled = true;
  try {
    const r = await fetch(`/api/session/${encodeURIComponent(sessionId)}/select`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({hotel_id: item.hotel_id, revision: (hv && hv.revision) || ""}),
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 409) {          // 旧列表：后端拒绝按位置猜
      markStaleCards();
      sysNotice("⚠️ 酒店列表已更新，请按最新列表重新选择。");
      return;
    }
    if (r.status === 404) {          // 会话过期 / 酒店不在当前列表
      markStaleCards();
      sysNotice(d.detail || "⚠️ 会话已过期或该酒店不在当前列表，请重新搜索。");
      return;
    }
    if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));

    const urec = remember("sys", `👉 已选择：${item.name || item.hotel_id}`);
    append("sys", urec.text, false, urec);
    const rec = remember("bot", d.reply, {rich: true, hotelTotal: 0, hotelShown: 0, next: 0});
    append("bot", d.reply, true, rec);
    if (d.current_order) {
      const orec = remember("sys", "📌 " + d.current_order);
      append("sys", orec.text, false, orec);
    }
    markStaleCards();                 // 已进入选房阶段，旧酒店卡片不再可点
    saveCurrentScroll();
  } catch (e) {
    sysNotice("❌ 选择失败：" + e.message);
    btn.disabled = false;
    btn.textContent = "选这家";
  } finally {
    _selecting = false;
    sessionSelect.disabled = false;
    newSessionBtn.disabled = false;
    input.focus();
  }
}


function showWelcome() {
  const div = document.createElement("div");
  div.className = "sys";
  div.textContent = '👋 你好！告诉我想订哪的酒店就行，例如"帮我订下周末三亚海景房，预算 1000 以内"。';
  chatbox.appendChild(div);
}

function renderHistory() {
  const s = ensureSession();
  sessionId = s.id;
  // 切会话/恢复历史会清空 DOM：断开旧观察器，避免已移除的图片节点一直挂在 observer 上
  if (_imgObserver) { _imgObserver.disconnect(); _imgObserver = null; }
  chatbox.innerHTML = "";
  if (!s.messages.length) showWelcome();
  for (const rec of s.messages) {
    const rich = rec.role === "bot" && rec.rich !== false;
    let div;
    if (rec.role === "bot" && rec.hotelView) {
      // 结构化卡片按落盘快照重建；是否仍可点由后端 revision 校验兜底
      div = append("bot", "", rich, rec);
      renderHotelViewInto(div, rec.hotelView, rec);
    } else {
      div = append(rec.role, rec.text, rich, rec);
    }
    if (rec.role === "bot" && !rec.stale && rec.hotelTotal > (rec.next || 0)) {
      addHotelExpander(div, div.querySelector("span"), rec.hotelTotal, rec.next || 0);
    }
  }
  updateSessionSelect();
  chatbox.scrollTop = s.scroll || chatbox.scrollHeight;
}

function activateSession(id) {
  if (id === store.active) return;
  const s = store.sessions.find(x => x.id === id);
  if (!s) return;
  saveCurrentScroll();
  store.active = id;
  sessionId = id;
  _safeSet(SID_KEY, id);
  persist();
  renderHistory();
  checkServerSession();
}

function createSession() {
  const cur = currentSession();
  if (cur && !cur.messages.length) {   // 已经是空白会话，不必再叠一个
    const tip = document.createElement("div");
    tip.className = "sys notice";
    tip.textContent = "当前已经是新会话，直接输入需求即可。";
    chatbox.appendChild(tip);
    chatbox.scrollTop = chatbox.scrollHeight;
    setTimeout(() => tip.remove(), 2500);
    input.focus();
    return;
  }
  saveCurrentScroll();
  const s = {id: _uid(), createdAt: Date.now(), updatedAt: Date.now(), scroll: 0, messages: []};
  store.sessions.unshift(s);
  store.active = s.id;
  sessionId = s.id;
  _safeSet(SID_KEY, s.id);
  trimSessions();
  persist();
  renderHistory();
  input.focus();
}

function adoptServerSession(newId) {
  const s = currentSession();
  if (!s || !newId || newId === s.id) return;
  s.id = newId;
  store.active = newId;
  sessionId = newId;
  _safeSet(SID_KEY, newId);
  persist();
  updateSessionSelect();
}

async function checkServerSession() {
  const s = currentSession();
  if (!s || !s.messages.length) return;
  const id = s.id;
  const check = ++_sessionCheck;
  try {
    const r = await fetch("/api/session/" + encodeURIComponent(id), {cache: "no-store"});
    if (!r.ok) return;
    const d = await r.json();
    if (check !== _sessionCheck || store.active !== id) return;  // 等待期间已发送/切走
    if (!d.exists) {
      const div = document.createElement("div");
      div.className = "sys notice";
      div.textContent = "⚠️ 服务端会话上下文已过期（30 分钟无活动或服务重启）。历史记录已保留，继续发送会从新上下文开始。";
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
      markStaleCards();          // 会话没了：旧列表不能再点，避免选出别家
    } else {
      // 服务端有列表：版本一致的卡片保持可点，旧版本全部置灰
      // （服务端无列表时传 null，把历史卡片一并置灰）
      markStaleCards(d.search_revision || null);
    }
  } catch (e) {
    // 网络异常不打扰正常聊天
  }
}

sessionSelect.addEventListener("change", () => {
  if (sessionSelect.value !== store.active) activateSession(sessionSelect.value);
});
newSessionBtn.onclick = createSession;
window.addEventListener("pagehide", saveCurrentScroll);

// ---------- 富文本渲染：URL → 内嵌图片 / 可点链接（DOM API 拼装，无 XSS 风险）----------
const URL_RE   = /https?:\/\/[^\s，。；、！？（）)】"'<>]+/g;
const IMG_RE   = /\.(jpe?g|png|webp|gif)[^\s]*$/i;   // 扩展名后允许 CDN 尾巴（如 .jpg-t、?x-oss-…）

// ---------- 图片串行加载队列 ----------
// 道旅 CDN 有突发并发风控：实测 8 张同时请求 → 5 张 403。
// 改为逐张加载（失败重试 1 次），彻底避开限流窗口。
const _imgQueue = [];
let _imgBusy = false;
// 房型图组一次可能出现几十张：滚动到可视区附近才入队，
// 既避免串行加载太久，也不并发冲击 CDN 风控。
let _imgObserver = null;

function _enqueueImg(img, url) {
  img.dataset.src = url;
  if (!("IntersectionObserver" in window)) { _pushImg(img, url); return; }
  if (!_imgObserver) {
    _imgObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        _imgObserver.unobserve(e.target);
        _pushImg(e.target, e.target.dataset.src);
      }
    }, { root: chatbox, rootMargin: "300px 0px" });
  }
  _imgObserver.observe(img);
}

function _pushImg(img, url) {
  _imgQueue.push([img, url]);
  _pumpImg();
}

function _pumpImg() {
  if (_imgBusy || !_imgQueue.length) return;
  _imgBusy = true;
  const [img, url] = _imgQueue.shift();
  const finish = () => { _imgBusy = false; _pumpImg(); };
  img.onload = finish;
  img.onerror = () => {
    if (+(img.dataset.retry || 0) < 1) {          // 403 是临时风控，稍候重试一次
      img.dataset.retry = "1";
      setTimeout(() => { img.src = url; }, 800);
      return;                                     // 不 finish，重试结果出来再放行
    }
    const a = document.createElement("a");        // 仍失败：退化为可点链接
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url;
    img.replaceWith(a);
    finish();
  };
  img.src = url;
}

function renderRich(span, text, appendMode) {
  // 按 URL 分段：普通文本走 textNode，图片 URL 渲染 <img>，其余渲染 <a>
  // appendMode=true 时保留已有内容，用于“展开全部”把后续酒店追加到同一条消息
  if (!appendMode) span.textContent = "";
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while ((m = URL_RE.exec(text)) !== null) {
    if (m.index > last) {
      span.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const url = m[0];
    if (IMG_RE.test(url)) {
      const img = document.createElement("img");
      img.className = "chat-img";
      img.alt = "酒店实拍图";
      img.referrerPolicy = "no-referrer";
      img.onclick = () => window.open(url, "_blank", "noopener,noreferrer");
      _enqueueImg(img, url);          // 串行队列加载，失败重试后仍败则退化 <a>
      span.appendChild(img);
    } else {
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = "🔗 " + url;
      span.appendChild(a);
    }
    last = m.index + url.length;
  }
  if (last < text.length) {
    span.appendChild(document.createTextNode(text.slice(last)));
  }
  groupGalleries(span);
}

// 把连续出现的图片包进一个横向图组（房型多图），单张图保持原样
function groupGalleries(span) {
  const nodes = Array.from(span.childNodes);
  for (let i = 0; i < nodes.length; i++) {
    const first = nodes[i];
    if (first.nodeType !== 1 || !first.classList.contains("chat-img")) continue;
    const run = [first];
    let j = i + 1;
    while (j < nodes.length) {
      const n = nodes[j];
      if (n.nodeType === 3 && !n.textContent.trim()) { j++; continue; }
      if (n.nodeType === 1 && n.classList.contains("chat-img")) { run.push(n); j++; continue; }
      break;
    }
    if (run.length > 1) {
      // 清掉图与图之间的换行/缩进，否则图组前后会多出空行
      for (let k = i + 1; k < j; k++) {
        const n = nodes[k];
        if (n.nodeType === 3 && !n.textContent.trim()) n.remove();
      }
      const box = document.createElement("span");
      box.className = "chat-gallery";
      first.before(box);
      run.forEach(img => box.appendChild(img));
    }
    i = j - 1;
  }
}

function append(cls, text, rich, rec) {
  const div = document.createElement("div");
  div.className = cls;
  const span = document.createElement("span");
  if (rich) { renderRich(span, text); }
  else      { span.textContent = text; }
  div.appendChild(span);
  if (rec) div._rec = rec;      // 关联持久化记录：展开全部时回写正文/进度
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
  return div;
}

// ---------- 展开全部：按需补全剩余酒店的真实评分 ----------
// 后端每段补 5 家（受百度/高德 QPS 限制，约 2-3 秒），逐段追加而不是一次等完。
// 评分全部来自真实接口/7 天缓存；查不到仍是“暂无评分”，不做任何伪造。
// 结构化视图下追加的是 items（卡片），旧版纯文本视图仍兼容 text。
async function expandHotels(div, span, btn) {
  btn.disabled = true;
  const total = +btn.dataset.total;
  const rev = div.dataset.revision || "";
  const view = div.querySelector(".hotel-view");
  let offset = +btn.dataset.next;
  try {
    while (offset < total) {
      if (btn.dataset.stale) return;    // 用户已发新消息，搜索结果被替换，停止追加
      btn.textContent = `⏳ 正在补全评分…（已展示 ${offset}/${total} 家）`;
      const r = await fetch("/api/hotels/more", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, offset, limit: 5, revision: rev}),
      });
      if (r.status === 409 || r.status === 404) {
        // 列表已更新 / 会话过期：停止追加并置灰旧卡片
        markStaleCards();
        btn.remove();
        sysNotice(r.status === 409
          ? "⚠️ 酒店列表已更新，请按最新列表重新选择。"
          : "⚠️ 会话已过期，请重新搜索。");
        return;
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      if (d.items && d.items.length && view) {
        const outroEl = view.querySelector(".hv-outro");
        d.items.forEach((it, i) => {
          const card = appendHotelCard(view, it, offset + i + 1, {revision: rev});
          if (outroEl) view.insertBefore(card, outroEl);   // 新卡片始终排在引导语之前
        });
        if (div._rec && div._rec.hotelView) {
          div._rec.hotelView.items.push(...d.items);   // 刷新/返回后卡片不丢
        }
      } else if (d.text) {
        // 兼容旧版后端（只返回文本）
        renderRich(span, "\n" + d.text, true);
        // 回写持久化记录：刷新/从订单页返回后，已展开的酒店不丢
        if (div._rec) div._rec.text += "\n" + d.text;
      }
      if (!d.next || d.next <= offset) break;     // 防御：后端未推进则退出
      offset = d.next;
      btn.dataset.next = offset;
      if (div._rec) { div._rec.next = offset; persist(); }
      chatbox.scrollTop = chatbox.scrollHeight;
    }
    btn.remove();
  } catch (e) {
    // 保留已展开部分，允许从断点重试
    btn.disabled = false;
    btn.textContent = "展开失败，点击重试";
  }
}

function addHotelExpander(div, span, total, shown) {
  const btn = document.createElement("button");
  btn.className = "expand-hotels";
  const rec = div._rec;
  btn.textContent = (rec && shown > (rec.hotelShown || 0))
    ? `继续展开（已展示 ${shown}/${total} 家）`
    : `展开全部（共 ${total} 家）`;
  btn.dataset.next = shown;
  btn.dataset.total = total;
  btn.onclick = () => expandHotels(div, span, btn);
  div.appendChild(btn);
}

// 新一轮搜索会替换会话里的 search_results，旧消息的“展开全部”已失效
function markOldExpandersStale() {
  const s = currentSession();
  if (s) {
    let changed = false;
    for (const m of s.messages) {
      if (m.hotelTotal && !m.stale) { m.stale = true; changed = true; }
    }
    if (changed) persist();
  }
  chatbox.querySelectorAll(".expand-hotels").forEach(b => {
    b.dataset.stale = "1";
    b.remove();
  });
}

async function sendMsg() {
  if (send.disabled) return;              // 上一条还在请求中，Enter 不重复发送
  const text = input.value.trim();
  if (!text) return;
  _sessionCheck++;                        // 有新消息：忽略启动时还没返回的“上下文过期”检查
  markOldExpandersStale();
  const userRec = remember("user", text);
  append("user", text, false, userRec);
  input.value = "";
  send.disabled = true;
  // 请求期间禁止切会话，避免回复落到另一段对话里
  sessionSelect.disabled = true;
  newSessionBtn.disabled = true;
  // 状态条：SSE stage 事件实时更新文案（理解需求 → 搜索酒店 → 获取报价）
  const status = append("bot", "正在连接助手…");
  status.classList.add("status");
  try {
    const r = await fetch("/api/chat/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_input: text, session_id: sessionId}),
    });
    if (!r.ok || !r.body) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", reply = null, currentOrder = "", errMsg = null;
    let hotelTotal = 0, hotelShown = 0, hotelView = null;
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {   // SSE 帧以空行分隔
        const block = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        for (const line of block.split("\n")) {
          if (line.startsWith("event:")) ev = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const d = JSON.parse(data);
        if (ev === "stage") {
          status.querySelector("span").textContent = "⏳ " + d.text;
        } else if (ev === "result") {
          reply = d.reply;
          currentOrder = d.current_order;
          hotelTotal = d.hotel_total || 0;
          hotelShown = d.hotel_shown || 0;
          hotelView = d.hotel_view || null;
          if (d.session_id && d.session_id !== sessionId) {
            adoptServerSession(d.session_id);
          }
        } else if (ev === "error") {
          errMsg = d.message;
        }
      }
    }
    status.remove();
    if (errMsg) {
      const rec = remember("bot", "❌ " + errMsg, {rich: false});
      append("bot", rec.text, false, rec);
    } else if (reply !== null) {
      let botDiv;
      if (hotelView) {
        // 结构化列表：intro 文案 + 卡片（hotel_id 定位）+ 操作引导，不再渲染回复正文里的列表
        const hv = hotelView;
        const rec = remember("bot", reply, {
          rich: true, hotelTotal, hotelShown,
          next: (hv.items || []).length, hotelView: hv,
        });
        botDiv = append("bot", "", true, rec);
        renderHotelViewInto(botDiv, hv, rec);
        markStaleCards(hv.revision);   // 旧版本卡片置灰，只有本次列表可点
        if (hv.total > (hv.items || []).length) {
          addHotelExpander(botDiv, botDiv.querySelector("span"),
                           hv.total, (hv.items || []).length);
        }
      } else {
        const rec = remember("bot", reply, {
          rich: true, hotelTotal, hotelShown, next: hotelShown,
        });
        botDiv = append("bot", reply, true, rec);
        if (hotelTotal > hotelShown) {
          addHotelExpander(botDiv, botDiv.querySelector("span"), hotelTotal, hotelShown);
        }
      }
      if (currentOrder) {
        const orec = remember("sys", "📌 " + currentOrder);
        append("sys", orec.text, false, orec);
      }
    } else {
      const rec = remember("bot", "(连接中断，未收到完整回复)", {rich: false});
      append("bot", rec.text, false, rec);
    }
  } catch (e) {
    status.remove();
    const rec = remember("bot", "❌ 请求失败：" + e.message, {rich: false});
    append("bot", rec.text, false, rec);
  } finally {
    send.disabled = false;
    sessionSelect.disabled = false;
    newSessionBtn.disabled = false;
    input.focus();
    saveCurrentScroll();
  }
}

// 启动：恢复当前会话（含聊天记录/展开进度/滚动位置）
// 本地数据可能被用户/插件改坏：恢复失败也要保证输入框和按钮可用
try {
  renderHistory();
  checkServerSession();
} catch (e) {
  console.warn("恢复会话历史失败，已从空白会话开始：", e);
  chatbox.innerHTML = "";
  showWelcome();
  updateSessionSelect();
}

send.onclick = sendMsg;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
</script>
