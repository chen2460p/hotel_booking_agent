<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>历史订单 · 酒店预订 Agent</title>
<style>
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { color: #2c3e50; }
  .topbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; font-size: 13px; color: #666; }
  .topbar a { color: #2980b9; text-decoration: none; }
  .tag { background: #ecf0f1; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { border-bottom: 1px solid #eee; padding: 8px 10px; text-align: left; }
  th { background: #f8f9fa; color: #555; white-space: nowrap; }
  /* 订单号/价格/状态/来源/操作不折行；酒店与房型列允许换行 */
  td:nth-child(1), td:nth-child(6), td:nth-child(7), td:nth-child(8), td:nth-child(9),
  th:nth-child(6), th:nth-child(7), th:nth-child(8), th:nth-child(9) { white-space: nowrap; }
  tr:hover td { background: #fafbfc; }
  .status-pending { color: #e67e22; }
  .status-paid    { color: #27ae60; }
  .status-cancel  { color: #95a5a6; text-decoration: line-through; }
  .btn { padding: 4px 12px; background: #2980b9; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 6px; }
  .btn:hover { background: #1e6fa0; }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a93226; }
  .pay-link { color: #e67e22; }
  .time { white-space: nowrap; font-variant-numeric: tabular-nums; color: #34495e; }
  .detail-row td { background: #fbfdff; padding: 0 10px 10px; border-bottom: 1px solid #eee; }
  .detail-box {
    display: flex; flex-wrap: wrap; gap: 22px; align-items: center;
    margin-left: 10px; padding: 8px 12px; border-left: 3px solid #b7d7ee;
    background: #f5faff; border-radius: 0 6px 6px 0; font-size: 13px; color: #52616b;
  }
  .detail-box b { color: #2c3e50; font-weight: 600; }
  .pay-badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; background: #eaf7ef; color: #27ae60; font-size: 11px; }
  .empty { text-align: center; padding: 40px; color: #999; }
  .filter { margin-top: 12px; }
  .filter a { display: inline-block; padding: 4px 12px; margin-right: 6px; border: 1px solid #ddd; border-radius: 14px; text-decoration: none; color: #555; font-size: 13px; }
  .filter a.active { background: #2980b9; color: #fff; border-color: #2980b9; }
</style>
</head>
<body>
<h1>📋 历史订单</h1>
<div class="topbar">
  <span class="tag">存储：{{ storage_backend }}</span>
  <a href="/">← 返回聊天</a>
</div>

<div class="filter">
  <a class="{{ 'active' if current_filter=='ALL' else '' }}" href="/orders?filter=ALL">全部</a>
  <a class="{{ 'active' if current_filter=='PENDING' else '' }}" href="/orders?filter=PENDING">待支付</a>
  <a class="{{ 'active' if current_filter=='FINISHED' else '' }}" href="/orders?filter=FINISHED">已完成</a>
  <a class="{{ 'active' if current_filter=='CANCELLED' else '' }}" href="/orders?filter=CANCELLED">已取消</a>
</div>

<div id="table_container"></div>

<script>
// 时间格式统一为 "YYYY-MM-DD HH:MM"；接口给的是 "YYYY-MM-DD HH:MM:SS"
function fmtTime(v) {
  if (!v) return "-";
  const s = String(v).replace("T", " ");
  return s.length >= 16 ? s.slice(0, 16) : s;
}
// 最近动态：优先支付时间，其次状态变更时间，最后创建时间
function lastEvent(o) {
  if (o.paid_time) return `${fmtTime(o.paid_time)} 支付成功`;
  if (o.updated_at && o.updated_at !== o.create_time) {
    return `${fmtTime(o.updated_at)} ${o.status_text || o.status || "状态更新"}`;
  }
  if (o.create_time) return `${fmtTime(o.create_time)} 创建订单`;
  return "-";
}

async function loadOrders() {
  const urlParams = new URLSearchParams(window.location.search);
  const current_filter = urlParams.get("filter") || "ALL";
  const r = await fetch(`/api/orders?filter=${current_filter}`);
  const data = await r.json();
  const rows = data.rows || [];

  const container = document.getElementById("table_container");
  if (!rows.length) {
    container.innerHTML = `<div class="empty">暂无${current_filter}订单</div>`;
    return;
  }

  let html = `<table>
    <tr><th>订单号</th><th>酒店</th><th>房型</th><th>入住</th><th>下单时间</th><th>总价</th><th>状态</th><th>来源</th><th>操作</th></tr>`;
  for (const o of rows) {
    const bucket = o.status_bucket ||
      (o.status === "pending" ? "PENDING" :
       o.status === "cancelled" ? "CANCELLED" : "FINISHED");
    const status = (bucket === "PENDING" && o.source === "rollinggo")
      ? "待支付" : (o.status_text || o.status);
    const cls = bucket === "PENDING" ? "status-pending" :
                bucket === "CANCELLED" ? "status-cancel" : "status-paid";
    let action = "";
    if (bucket === "PENDING") {
      if (o.source === "rollinggo") {
        if (o.payment_url) {
          action += `<a class="pay-link" target="_blank" href="${o.payment_url}">去支付</a>`;
        }
        action += `<button class="btn danger" onclick="cancelReal('${o.order_no}')">取消订单</button>`;
      } else if (o.source === "mock") {
        action += `<button class="btn" onclick="pay('${o.order_no}')">标记支付</button>`;
        action += `<button class="btn danger" onclick="cancel('${o.order_no}')">取消</button>`;
      }
    }
    const paidMark = o.paid_time ? `<span class="pay-badge">已支付</span>` : "";
    html += `<tr>
      <td>${o.order_no}</td>
      <td>${o.hotel_name}</td>
      <td>${o.room_name || '-'}</td>
      <td class="time">${o.check_in || '?'} → ${o.check_out || '?'}</td>
      <td class="time">${fmtTime(o.create_time)}</td>
      <td>${o.total_price} ${o.currency || 'CNY'}</td>
      <td class="${cls}">${status}${paidMark}</td>
      <td>${o.source === "rollinggo" ? '【道旅】' : '本地'}</td>
      <td>${action || '-'}</td>
    </tr>`;
    // 有支付时间的订单多展示一行明细：创建/支付/最近动态分开，互不覆盖
    if (o.paid_time) {
      html += `<tr class="detail-row"><td colspan="9">
        <div class="detail-box">
          <span>下单时间：<b>${fmtTime(o.create_time)}</b></span>
          <span>支付时间：<b>${fmtTime(o.paid_time)}</b></span>
          <span>最近动态：<b>${lastEvent(o)}</b></span>
        </div>
      </td></tr>`;
    }
  }
  html += `</table>`;
  container.innerHTML = html;
}

async function pay(id) {
  if (!confirm(`确认标记订单 ${id} 为已支付？`)) return;
  const r = await fetch(`/api/orders/${id}/pay`, {method: "POST"});
  alert((await r.json()).ok ? "已标记支付" : "操作失败");
  loadOrders();
}
async function cancel(id) {
  if (!confirm(`确认取消订单 ${id}？`)) return;
  const r = await fetch(`/api/orders/${id}/cancel`, {method: "POST"});
  const d = await r.json();
  if (d.ok) { alert("已取消"); loadOrders(); }
  else if (d.reason === "remote_unsupported") { alert(d.message || "道旅真实订单请手动在网页取消"); }
  else { alert(d.message || "操作失败"); }
}

async function cancelReal(id) {
  // 第一步：询价，拿到罚金和 10 分钟有效的取消凭证
  const r = await fetch(`/api/orders/${id}/pre-cancel`, {method: "POST"});
  const q = await r.json();
  if (!r.ok || !q.ok) {
    alert(q.message || "该订单暂时无法在线取消，请联系道旅客服。");
    return;
  }
  const penalty = q.penalty == null ? null : Number(q.penalty);
  const total = Number(q.total_price || 0);
  const refund = penalty == null ? null : Math.max(total - penalty, 0);
  const lines = [
    `确认取消订单 ${id}？`,
    `酒店：${q.hotel_name || "-"}`,
    `订单总价：¥${total}`,
    `取消罚金：${penalty == null ? "以道旅页面为准" : "¥" + penalty}`,
  ];
  if (refund != null) lines.push(`预计退款：¥${refund}`);
  if (q.message) lines.push("", q.message);
  lines.push("", "取消不可撤销，确认继续？");
  if (!confirm(lines.join("\n"))) return;

  // 第二步：带凭证提交确认取消
  const r2 = await fetch(`/api/orders/${id}/cancel`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      confirm: true,
      confirm_id: q.confirm_id,
      booking_id: q.booking_id,
    }),
  });
  const d = await r2.json();
  alert(d.message || (d.ok ? "已取消" : "取消失败"));
  loadOrders();
}

loadOrders();
</script>
</body>
</html>
